name: Build Windows app

on:
  push:
    tags: ['v*']        # push a tag like v1.0.0 to publish a release
  workflow_dispatch:     # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path "dist/Farm Decal Swapper-win32-x64/*" -DestinationPath "dist/Farm-Decal-Swapper-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Farm-Decal-Swapper-win-x64
          path: dist/Farm-Decal-Swapper-win-x64.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Farm-Decal-Swapper-win-x64.zip
